name: GHCR package visibility

# New org packages on ghcr.io default to private. This job tries to make
# ffp-sql-sandbox-runner public so anonymous `docker pull` works.
# Making a package public cannot be undone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ghcr-visibility.yml'

permissions:
  packages: write

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: Set GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="orgs/FFP-Tech-Lab/packages/container/ffp-sql-sandbox-runner"
          if ! current="$(gh api "$api" --jq .visibility)"; then
            echo "::warning::Could not read GHCR package metadata. Set visibility in the UI: https://github.com/orgs/FFP-Tech-Lab/packages"
            exit 0
          fi
          echo "Current visibility: ${current}"
          if [ "$current" = "public" ]; then
            echo "Package is already public."
            exit 0
          fi
          if gh api --method PATCH "$api" -f visibility=public; then
            echo "Package visibility is now public."
          else
            echo "::warning::API could not set visibility to public. In the GitHub UI: Package settings → Danger Zone → Change visibility → Public. See README."
          fi
