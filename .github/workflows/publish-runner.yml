name: Publish runner image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sandbox/**'
      - '.github/workflows/publish-runner.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ffp-tech-lab/ffp-sql-sandbox-runner

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./sandbox
          file: ./sandbox/Dockerfile
          push: true
          # Keep permissions to contents:read + packages:write (no id-token).
          provenance: false
          sbom: false
          tags: |
            ghcr.io/ffp-tech-lab/ffp-sql-sandbox-runner:v1
            ghcr.io/ffp-tech-lab/ffp-sql-sandbox-runner:0.1.0

      - name: Record image digest
        env:
          PUSH_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_NAME}:v1"
          INSPECT_DIGEST="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          DIGEST="${PUSH_DIGEST:-$INSPECT_DIGEST}"
          if [[ -z "$DIGEST" || "$DIGEST" != sha256:* ]]; then
            echo "Failed to resolve image digest (push='$PUSH_DIGEST' inspect='$INSPECT_DIGEST')" >&2
            exit 1
          fi
          PIN="${IMAGE_NAME}@${DIGEST}"
          echo "Published ${PIN}"
          {
            echo "## Runner image digest"
            echo ""
            echo "Pushed \`${IMAGE_NAME}:v1\` and \`${IMAGE_NAME}:0.1.0\`."
            echo ""
            echo "Pin this in \`DEFAULT_SANDBOX_IMAGE\`:"
            echo ""
            echo '```'
            echo "$PIN"
            echo '```'
            echo ""
            echo "Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
